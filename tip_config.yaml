tip_settings:
  history_db_path: "data/tip_history.db"
  cooldown_days: 365
  output_dir: "output/tip_images"

tip_categories:
  - name: "3D Printing PLA Tips"
    vertical: "3d"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "pla-clean-build-plate"
        title: "PLA First Layer Tip"
        headline: "Clean the build plate before chasing slicer settings"
        body: "Skin oils and dust can reduce first-layer grip even when your temperatures and Z offset are correct."
        bullets:
          - "Wash removable plates as the manufacturer recommends"
          - "Avoid touching the print area after cleaning"
          - "Recheck Z offset only after the surface is clean"
        description: "A simple PLA troubleshooting reminder: clean the build surface before changing a bunch of slicer settings. Save this for your next first-layer problem."
      - id: "pla-cooling"
        title: "PLA Cooling Tip"
        headline: "PLA usually benefits from strong part cooling"
        body: "Good cooling can improve bridges, overhangs, and small features after the first layers are established."
        bullets:
          - "Use gentler cooling on the first layers"
          - "Increase cooling for bridges and overhangs"
          - "Tune fan speed for your printer and filament"
        description: "PLA cooling affects bridges, overhangs, and small details. Save this quick 3D printing reminder for your next PLA profile."
      - id: "pla-temp-tower"
        title: "PLA Calibration Tip"
        headline: "Use a temperature tower when a new PLA behaves differently"
        body: "Two PLA brands can print differently at the same temperature. A temperature tower helps compare surface finish, bridging, and stringing."
        bullets:
          - "Change one variable at a time"
          - "Compare layer bonding and surface quality"
          - "Save the result in your filament profile"
        description: "A temperature tower is a useful way to dial in an unfamiliar PLA spool without guessing. Save this calibration tip for later."

  - name: "3D Printing PETG Tips"
    vertical: "3d"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "petg-dry"
        title: "PETG Quick Tip"
        headline: "Dry PETG when stringing suddenly gets worse"
        body: "Moisture can contribute to popping, rough surfaces, and extra stringing. Drying is worth checking before completely retuning your profile."
        bullets:
          - "Listen for popping or sizzling"
          - "Check for a rough or fuzzy surface"
          - "Store opened filament in a dry container"
        description: "PETG stringing can get worse when the filament has absorbed moisture. Save this quick troubleshooting reminder for your next PETG print."
      - id: "petg-build-plate-release"
        title: "PETG Build Plate Tip"
        headline: "PETG can stick very aggressively to some build surfaces"
        body: "Use the build-surface guidance from your printer or plate manufacturer and let the plate cool before forcing a finished part loose."
        bullets:
          - "Follow the plate manufacturer's PETG guidance"
          - "Let the bed cool before removal"
          - "Avoid prying hard against the build surface"
        description: "PETG can bond strongly to some build surfaces. Save this reminder to follow your plate manufacturer's PETG guidance and let parts cool before removal."
      - id: "petg-first-layer"
        title: "PETG First Layer Tip"
        headline: "Do not judge PETG adhesion by PLA settings alone"
        body: "PETG often prefers a different first-layer setup than PLA, so copying every PLA setting can create unnecessary troubleshooting."
        bullets:
          - "Start from a PETG-specific material profile"
          - "Adjust one setting at a time"
          - "Watch the first layer before changing everything"
        description: "PETG and PLA do not always want the same first-layer setup. Save this reminder to start with a PETG-specific profile and tune from there."

  - name: "3D Printing First Layer Tips"
    vertical: "3d"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "first-layer-three-checks"
        title: "3 First-Layer Checks"
        headline: "Check these before restarting the print"
        body: "A bad first layer is usually easier to diagnose when you check the basics in a consistent order."
        bullets:
          - "Clean build surface"
          - "Verify Z offset or nozzle height"
          - "Confirm material and bed temperatures"
        description: "Three basic checks for first-layer problems: surface cleanliness, nozzle height, and material temperatures. Save this quick troubleshooting checklist."
      - id: "first-layer-slow"
        title: "First Layer Speed Tip"
        headline: "A slower first layer can improve consistency"
        body: "Reducing first-layer speed gives the filament more time to form a consistent line and lets you spot height or adhesion problems early."
        bullets:
          - "Watch the first few lines"
          - "Look for gaps or excessive squish"
          - "Tune speed after height is correct"
        description: "A slower first layer can make adhesion and nozzle-height problems easier to see. Save this 3D printing setup reminder."
      - id: "first-layer-one-change"
        title: "First Layer Troubleshooting"
        headline: "Change one variable at a time"
        body: "Changing Z offset, temperature, flow, speed, and bed settings all at once makes it hard to learn what actually fixed the problem."
        bullets:
          - "Start with the most obvious issue"
          - "Make one small adjustment"
          - "Retest before changing another setting"
        description: "When troubleshooting first-layer issues, change one variable at a time so you know what actually helped. Save this reminder for later."

  - name: "3D Printer Maintenance Tips"
    vertical: "3d"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "maintenance-loose-fasteners"
        title: "3D Printer Maintenance Tip"
        headline: "Check for loose hardware before tuning software"
        body: "Mechanical looseness can look like a slicer problem. Periodically inspect the printer according to the manufacturer's maintenance guidance."
        bullets:
          - "Check accessible fasteners"
          - "Inspect belts and moving parts"
          - "Follow the printer's maintenance schedule"
        description: "Some print-quality problems are mechanical, not slicer-related. Save this reminder to inspect hardware and follow your printer manufacturer's maintenance guidance."
      - id: "maintenance-nozzle"
        title: "Nozzle Maintenance Tip"
        headline: "A worn or damaged nozzle can affect print quality"
        body: "If extrusion quality changes and normal troubleshooting does not help, inspect the nozzle and replace it when appropriate for your printer."
        bullets:
          - "Check for visible wear or damage"
          - "Confirm the nozzle size in the slicer"
          - "Use the correct replacement procedure"
        description: "A worn or damaged nozzle can affect extrusion and print quality. Save this maintenance reminder for future troubleshooting."
      - id: "maintenance-clean-rods"
        title: "Motion System Reminder"
        headline: "Keep motion components clean according to the manual"
        body: "Dust and debris on motion components can contribute to rough movement. Cleaning and lubrication requirements vary by printer."
        bullets:
          - "Follow your model's maintenance instructions"
          - "Use only recommended lubricants"
          - "Do not over-lubricate"
        description: "Motion-system maintenance varies by printer. Save this reminder to follow the manufacturer's cleaning and lubrication instructions."

  - name: "3D Printing Filament Storage Tips"
    vertical: "3d"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "storage-sealed"
        title: "Filament Storage Tip"
        headline: "Keep opened filament sealed when you are not printing"
        body: "Many printing materials absorb moisture from the air over time. A sealed container with appropriate desiccant can help limit exposure."
        bullets:
          - "Seal spools after use"
          - "Monitor desiccant condition"
          - "Label materials and open dates"
        description: "Opened filament can absorb moisture over time. Save this simple storage reminder: seal spools, monitor desiccant, and keep materials organized."
      - id: "storage-label"
        title: "Filament Organization Tip"
        headline: "Label spools with the material and profile you actually use"
        body: "A simple label can save time when two similar-looking spools need different temperatures or printer profiles."
        bullets:
          - "Material type"
          - "Brand or product line"
          - "Your tested profile or notes"
        description: "Labeling filament with the material, brand, and tested profile can save setup time later. Save this organization idea for your print area."

  - name: "Honda CB750 Restoration Tips"
    vertical: "honda"
    board: "Vintage Honda Motorcycle Parts"
    topics:
      - "Motorcycles"
    tips:
      - id: "honda-photo-before-disassembly"
        title: "CB750 Restoration Tip"
        headline: "Photograph assemblies before taking them apart"
        body: "Reference photos can make routing, hardware placement, and reassembly much easier after a project has been apart for weeks."
        bullets:
          - "Take wide and close-up photos"
          - "Capture cable and hose routing"
          - "Photograph hardware locations"
        description: "A simple vintage Honda restoration habit: photograph assemblies, cable routing, and hardware locations before disassembly. Save this for your CB750 project."
      - id: "honda-label-connectors"
        title: "CB750 Wiring Tip"
        headline: "Label connectors as you disconnect them"
        body: "Temporary labels and reference photos can reduce confusion when reinstalling an older motorcycle wiring harness."
        bullets:
          - "Label both sides when useful"
          - "Photograph routing before removal"
          - "Keep related hardware together"
        description: "Labeling connectors and photographing harness routing can make vintage Honda reassembly much easier. Save this CB750 restoration reminder."
      - id: "honda-bag-hardware"
        title: "CB750 Project Organization"
        headline: "Bag and label hardware by assembly"
        body: "Keeping fasteners grouped by component helps avoid mystery bolts and makes a long restoration easier to resume."
        bullets:
          - "Use separate bags or containers"
          - "Write the assembly name on each"
          - "Add notes for unusual spacers or washers"
        description: "Keep vintage motorcycle hardware grouped and labeled by assembly. Save this organization tip for your Honda CB750 restoration."

  - name: "Honda CB750 Parts Buying Tips"
    vertical: "honda"
    board: "Vintage Honda Motorcycle Parts"
    topics:
      - "Motorcycles"
    tips:
      - id: "honda-fitment-check"
        title: "CB750 Parts Buying Tip"
        headline: "Verify year and submodel before ordering a used part"
        body: "CB750 parts can vary across years and versions. Compare part numbers, dimensions, photos, and seller fitment information before buying."
        bullets:
          - "Check model year and submodel"
          - "Compare OEM part numbers when available"
          - "Review dimensions and mounting points"
        description: "Vintage Honda CB750 fitment can vary by year and submodel. Save this buying checklist before ordering a used replacement part."
      - id: "honda-photo-compare"
        title: "Vintage Honda Parts Tip"
        headline: "Compare mounting points, not just the listing title"
        body: "A similar-looking part can still have different brackets, connectors, or dimensions. Detailed photo comparison can catch mismatches."
        bullets:
          - "Compare bolt locations"
          - "Check connectors and brackets"
          - "Ask for dimensions when unclear"
        description: "When buying vintage Honda parts, compare mounting points, connectors, and dimensions instead of relying only on the listing title."


  - name: "3D Printing Community Humor"
    vertical: "3d"
    content_type: "quote"
    board: "3D Printer Parts, Filament & Supplies"
    topics:
      - "3D Printing"
    tips:
      - id: "quote-ender-troubleshooting"
        title: "3D Printer Humor | Ender Troubleshooting"
        quote: "Why did my print fail? I checked the slicer, the filament, the bed... then I remembered I own an Ender."
        description: "A little 3D printing humor for anyone who has spent more time troubleshooting than printing. Save this if your printer has ever tested your patience."
      - id: "quote-spaghetti"
        title: "3D Printing Humor | Spaghetti Edition"
        quote: "Nothing builds confidence like starting an 8-hour print before bed and waking up to artisanal plastic spaghetti."
        description: "Every 3D printing hobbyist eventually creates a limited-edition spaghetti sculpture. Save this for the next failed overnight print."
      - id: "quote-first-layer"
        title: "3D Printing Humor | First Layer"
        quote: "3D printing is 10% making things and 90% staring at the first layer like it owes you money."
        description: "The first layer decides everything. A relatable 3D printing quote for anyone who watches the printer like a hawk."
      - id: "quote-calibration"
        title: "3D Printing Humor | Calibration"
        quote: "I bought a 3D printer to make parts. Apparently I also bought a full-time position in calibration."
        description: "A painfully relatable 3D printing joke for anyone who has spent an evening tuning instead of printing."
      - id: "quote-filament"
        title: "3D Printing Humor | Filament Collection"
        quote: "I don't have too much filament. I have a carefully curated inventory of colors I will definitely use someday."
        description: "For the 3D printing hobbyist whose filament shelf is slowly becoming a warehouse."
      - id: "quote-supports"
        title: "3D Printing Humor | Supports"
        quote: "Supports: because sometimes your model needs emotional and structural assistance."
        description: "A quick 3D printing joke for anyone who has ever spent longer removing supports than printing the part."
      - id: "quote-bed-level"
        title: "3D Printing Humor | Bed Leveling"
        quote: "My bed is level. My printer just has a different opinion."
        description: "A relatable 3D printer quote for anyone who has ever leveled the bed twice and somehow made it worse."
      - id: "quote-one-more-upgrade"
        title: "3D Printing Humor | One More Upgrade"
        quote: "The printer was only $200. The upgrades were a completely separate financial decision."
        description: "3D printing math works differently. Save this one if your budget printer slowly became a premium printer."

