  - name: "Vintage Honda Motorcycle Tips"
    vertical: "honda"
    content_type: "tip"
    board: "Vintage Honda Motorcycles"
    topics:
      - "Motorcycles"
    tips:
      - id: "honda-tip-reference-photos"
        title: "Vintage Honda Restoration Tip | Reference Photos"
        headline: "Take more photos than you think you need before disassembly"
        body: "Cable routing, hose placement, brackets, clips, and washer order are much easier to reproduce when you have clear reference photos."
        bullets:
          - "Take wide shots before removing parts"
          - "Photograph both sides of crowded areas"
          - "Capture close-ups of routing and hardware"
        description: "A simple vintage Honda restoration habit: take detailed reference photos before disassembly. They can save hours when it is time to put everything back together."
      - id: "honda-tip-label-carb-parts"
        title: "Vintage Honda Carburetor Tip"
        headline: "Keep carburetor parts organized by position"
        body: "On multi-carb motorcycles, keeping small parts grouped by carburetor can make inspection and reassembly much easier."
        bullets:
          - "Use labeled trays or bags"
          - "Keep jets and hardware organized"
          - "Photograph linkage before separating parts"
        description: "Working on a vintage Honda carburetor rack? Keep parts organized by position and photograph the linkage before disassembly."
      - id: "honda-tip-battery-first"
        title: "Vintage Honda Electrical Tip"
        headline: "Start electrical troubleshooting with the basics"
        body: "A weak battery, dirty connection, loose ground, or damaged fuse can create confusing symptoms on an older motorcycle."
        bullets:
          - "Check battery condition"
          - "Inspect grounds and connectors"
          - "Check fuses before chasing complex faults"
        description: "Vintage Honda electrical troubleshooting is easier when you start with battery condition, grounds, connectors, and fuses before diving deeper."
      - id: "honda-tip-part-numbers"
        title: "Vintage Honda Parts Tip | Part Numbers"
        headline: "Use OEM part numbers when comparing old replacement parts"
        body: "Visual similarity does not always mean interchangeability. Part numbers can help confirm whether a component belongs to the exact model and year you are working on."
        bullets:
          - "Compare model and year"
          - "Check OEM numbers when available"
          - "Confirm dimensions and mounting points"
        description: "When shopping for vintage Honda motorcycle parts, OEM part numbers can help confirm fitment before you buy."
      - id: "honda-tip-hardware-photos"
        title: "Vintage Honda Hardware Tip"
        headline: "Do not throw every fastener into one coffee can"
        body: "Separating hardware by assembly makes a long restoration easier to pause and resume without guessing where every bolt came from."
        bullets:
          - "Bag hardware by assembly"
          - "Label unusual spacers and washers"
          - "Add a quick photo to each group"
        description: "Keep vintage Honda motorcycle hardware organized by assembly instead of mixing everything together. Your future self will appreciate it."
